version: '3.4'

services:

  # N-Tier backend: the former WCF service, now an ASP.NET Core (net8.0) Web API
  # built as a Linux container.
  eshopwcfservice:
    image: eshop/wcfservice:${TAG:-latest}
    build:
      context: ./eShopLegacyNTier
      dockerfile: src/eShopWCFService/Dockerfile
    depends_on:
      - sql.data

  # Modernized .NET (net8.0) core API used as the strangler-fig core_backend.
  eshop.core.modernized:
    image: eshop/coremodernized:${TAG:-latest}
    build:
      context: ./eShopModernized/src/eShopCoreModernized
      dockerfile: Dockerfile
    depends_on:
      - sql.data

  # NOTE: eshop.modernized.mvc and eshop.modernized.webforms are .NET Framework
  # (Windows-only) apps and are tracked under separate tickets. They cannot run
  # as Linux containers and are intentionally excluded from this Linux compose
  # stack. Re-introduce them in a dedicated Windows compose file if needed.

  sql.data:
    image: mcr.microsoft.com/mssql/server:2022-latest
