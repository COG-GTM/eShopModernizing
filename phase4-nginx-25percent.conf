upstream legacy_backend {
    server localhost:5000;
}

upstream modernized_backend {
    server localhost:5001;
}

upstream core_backend {
    server localhost:5002;
}

# Catalog migration upstream - 100% to .NET Core (completed in Phase 3)
upstream catalog_migration {
    server localhost:5002 weight=1;
}

# Phase 4: Remaining routes migration upstream - 25% to .NET Core
upstream remaining_routes_migration {
    server localhost:5001 weight=3;  # 75% to modernized .NET Framework
    server localhost:5002 weight=1;  # 25% to .NET Core
}

server {
    listen 80;
    server_name localhost;

    # Health check endpoints go to .NET Core
    location /api/health {
        proxy_pass http://core_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enhanced health checks for migration monitoring
    location /api/health/detailed {
        proxy_pass http://core_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints go to .NET Core (completed in earlier phases)
    location /api/ {
        proxy_pass http://core_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catalog MVC endpoints - 100% .NET Core (completed in Phase 3)
    location /Catalog/ {
        proxy_pass http://catalog_migration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 4: Account endpoints with gradual migration (25% .NET Core)
    location /Account/ {
        proxy_pass http://remaining_routes_migration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 4: Home endpoints with gradual migration (25% .NET Core)
    location /Home/ {
        proxy_pass http://remaining_routes_migration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 4: Upload image legacy endpoint with gradual migration (25% .NET Core)
    location /uploadimage {
        proxy_pass http://remaining_routes_migration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 4: Static files with gradual migration (25% .NET Core)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://remaining_routes_migration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase 4: All remaining requests with gradual migration (25% .NET Core)
    location / {
        proxy_pass http://remaining_routes_migration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
