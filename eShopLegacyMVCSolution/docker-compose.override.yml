version: '3.4'

services:
  eshoplegacymvc:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CatalogDBContext=Server=sql.data;Database=Microsoft.eShopOnContainers.Services.CatalogDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - UseMockData=false
      - UseCustomizationData=false
    ports:
      - "5000:80"

  sql.data:
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - ACCEPT_EULA=Y
    ports:
      - "5433:1433"
