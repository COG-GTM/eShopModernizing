# SQL mode (UseMockData=false): EF Core 8 against SQL Server 2022, one database per app (no initializer race).
#   MSSQL_SA_PASSWORD must be set (sql.sh generates one into .sql.env, git-ignored):
#   docker compose -f net8/docker/compose.sql.yml --env-file net8/docker/.sql.env up -d --build --wait
name: eshop-storefront-sql

x-app-env: &app-env
  UseMockData: "false"
  UseCustomizationData: "${USE_CUSTOMIZATION_DATA:-false}"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD (see net8/docker/README.md)}"
    ports:
      - "127.0.0.1:${SQL_PORT:-14331}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30

  mvc:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mvc
    image: eshop-storefront-mvc:local
    environment:
      <<: *app-env
      ConnectionStrings__CatalogDBContext: "Server=sqlserver,1433;Database=eShopStorefrontCatalog_mvc;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MVC_SQL_PORT:-5210}:8080"

  webforms:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webforms
    image: eshop-storefront-webforms:local
    environment:
      <<: *app-env
      ConnectionStrings__CatalogDBContext: "Server=sqlserver,1433;Database=eShopStorefrontCatalog_webforms;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEBFORMS_SQL_PORT:-5211}:8080"
