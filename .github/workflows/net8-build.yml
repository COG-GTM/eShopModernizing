name: net8-build

on:
  pull_request:
    branches: [devin/net8-eshop-migration]
    paths:
      - "src-net8/**"
      - "migration/**"
      - ".github/workflows/net8-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: net8-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  COMPOSE_FILE: src-net8/docker-compose.yml

jobs:
  build-test:
    name: Build and test (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src-net8/global.json

      - name: Restore
        run: dotnet restore src-net8/eShopNet8.sln

      - name: Build
        run: dotnet build src-net8/eShopNet8.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test src-net8/eShopNet8.sln -c Release --no-build
          --logger "trx" --results-directory "${{ runner.temp }}/TestResults"
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults
          if-no-files-found: warn

  parity-mock:
    name: Containers (mock profile) + parity replay
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROFILES: mock
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start mock profile
        run: docker compose up -d --wait --wait-timeout 180

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install replay dependencies
        run: pip install "requests>=2.31" "beautifulsoup4>=4.12"

      - name: Replay legacy transcripts against the containers
        run: >-
          python3 migration/parity/replay.py
          --mvc-url http://localhost:5200
          --webforms-url http://localhost:5201
          --restart-cmd-mvc "docker compose restart mvc-mock"
          --restart-cmd-webforms "docker compose restart webforms-mock"
          --report-dir "${{ runner.temp }}/parity"

      - name: Parity summary
        if: always()
        run: |
          report="${{ runner.temp }}/parity/parity-report.txt"
          if [ -f "$report" ]; then
            { echo '```'; head -n 200 "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No parity report was produced (replay aborted before writing it; see container logs)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/parity"
          docker compose ps -a > "${{ runner.temp }}/parity/compose-ps.txt"
          docker compose logs --no-color > "${{ runner.temp }}/parity/compose-logs.txt"

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: ${{ runner.temp }}/parity
          if-no-files-found: warn

      - name: Stop containers
        if: always()
        run: docker compose down -v

  sql-smoke:
    name: Containers (sql profile) + SQL health
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROFILES: sql
    steps:
      - uses: actions/checkout@v4

      - name: Generate a throwaway sa password
        run: |
          password="Ci$(openssl rand -hex 12)!a1"
          echo "::add-mask::${password}"
          echo "MSSQL_SA_PASSWORD=${password}" >> "$GITHUB_ENV"

      - name: Build images
        run: docker compose build

      - name: Start sql profile
        run: docker compose up -d --wait --wait-timeout 300

      - name: Health endpoints include the SQL check
        run: |
          for port in 5200 5201; do
            body="$(curl -fsS "http://localhost:${port}/health")"
            echo "localhost:${port}/health -> ${body}"
            test "${body}" = "Healthy"
          done

      - name: Health turns unhealthy when SQL Server stops
        run: |
          docker compose stop sqldata
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 http://localhost:5200/health)"
          echo "MVC /health with SQL Server stopped -> ${code}"
          test "${code}" = "503"
          docker compose start sqldata

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/sql"
          docker compose ps -a > "${{ runner.temp }}/sql/compose-ps.txt"
          docker compose logs --no-color mvc webforms > "${{ runner.temp }}/sql/compose-logs.txt"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-smoke-logs
          path: ${{ runner.temp }}/sql
          if-no-files-found: warn

      - name: Stop containers
        if: always()
        run: docker compose down -v
