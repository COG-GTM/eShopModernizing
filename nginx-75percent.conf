# eShop /Catalog/ canary cutover - stage 75: 75% .NET Core (5002) / 25% modernized .NET Framework (5001)
#
# Include this file inside the nginx http {} block (e.g. /etc/nginx/conf.d/eshop.conf).
# Managed by canary/cutover.sh - see CANARY-CUTOVER-RUNBOOK.md before editing.
# Stage files must stay identical except for the stage number and the catalog_migration servers
# (enforced by canary/tests/test-stage-configs.sh).

upstream legacy_backend {
    server localhost:5000;
}

upstream modernized_backend {
    server localhost:5001;
}

upstream core_backend {
    server localhost:5002;
}

# Client affinity key: first X-Forwarded-For hop when present, otherwise the peer address.
map $http_x_forwarded_for $canary_client_key {
    "~^(?<canary_first_hop>[^,\s]+)" $canary_first_hop;
    default                           $remote_addr;
}

# Gradual migration upstream - 75% to .NET Core
# Consistent hashing keeps each client on one backend (auth cookies, session and antiforgery
# tokens are not shared between the two apps) and only moves clients towards .NET Core as
# the .NET Core weight grows.
upstream catalog_migration {
    hash $canary_client_key consistent;
    server localhost:5001 weight=1;  # 25% to modernized .NET Framework
    server localhost:5002 weight=3;  # 75% to .NET Core
}

# Tab-separated, parsed by canary/cutover.sh (field order is part of its contract):
# msec, stage, status, upstream_addr, upstream_status, request_time, upstream_response_time, method, request_uri
log_format eshop_canary '$msec\t$canary_stage\t$status\t$upstream_addr\t$upstream_status\t$request_time\t$upstream_response_time\t$request_method\t$request_uri';

server {
    listen 80;
    server_name localhost;

    set $canary_stage 75;
    add_header X-Canary-Stage $canary_stage always;

    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/eshop-canary.log eshop_canary;

    # Health check endpoints go to .NET Core
    location /api/health {
        proxy_pass http://core_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enhanced health checks for migration monitoring
    location /api/health/detailed {
        proxy_pass http://core_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints go to .NET Core (strangler fig pattern)
    location /api/ {
        proxy_pass http://core_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catalog MVC endpoints with gradual migration (75% .NET Core)
    location /Catalog/ {
        proxy_pass http://catalog_migration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other requests go to modernized .NET Framework app
    location / {
        proxy_pass http://modernized_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
