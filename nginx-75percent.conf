upstream legacy_backend {
    server localhost:5000;
}

upstream modernized_backend {
    server localhost:5001;
}

upstream core_backend {
    server localhost:5002;
}

# Gradual migration upstream - 75% to .NET Core
upstream catalog_migration {
    server localhost:5001 weight=1 max_fails=3 fail_timeout=30s;  # 25% to modernized .NET Framework
    server localhost:5002 weight=3 max_fails=3 fail_timeout=30s;  # 75% to .NET Core
}

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

log_format migration_json escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"correlation_id":"$correlation_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"deployment_track":"$upstream_http_x_deployment_track",'
    '"app_version":"$upstream_http_x_app_version",'
    '"migration_stage":"75"}';

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log migration_json;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $correlation_id;

    proxy_hide_header X-Correlation-ID;
    add_header X-Correlation-ID $correlation_id always;
    add_header X-Migration-Stage 75 always;

    # Gateway liveness (does not depend on any backend)
    location = /gateway/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"Healthy","service":"gateway","migrationStage":"75"}';
    }

    # .NET Core health probes: /health, /health/live, /health/ready, /health/detailed
    location /health {
        proxy_pass http://core_backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # Health check endpoints go to .NET Core (/api/health, /api/health/detailed)
    location /api/health {
        proxy_pass http://core_backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # API endpoints go to .NET Core (strangler fig pattern)
    location /api/ {
        proxy_pass http://core_backend;
    }

    # Catalog MVC endpoints with gradual migration (75% .NET Core)
    location /Catalog/ {
        proxy_pass http://catalog_migration;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # All other requests go to modernized .NET Framework app
    location / {
        proxy_pass http://modernized_backend;
    }
}
