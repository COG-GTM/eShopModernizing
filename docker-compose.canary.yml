# Linux stack for exercising the canary stages locally:
#   docker compose -f docker-compose.canary.yml up -d --build
#   docker compose -f docker-compose.canary.yml --profile baseline up -d --build   # also start a stand-in for :5001
#
# The gateway uses host networking so the stage configs (nginx*.conf, which target
# localhost:5001/5002) work unchanged. The repo directory (not the single file) is mounted so
# the gateway sees ./nginx.conf after migrate-traffic.sh replaces it.
name: eshop-canary

x-core-environment: &core-environment
  ConnectionStrings__CatalogDBContext: Server=sql.data;Database=Microsoft.eShopOnContainers.Services.CatalogDb;User Id=sa;Password=${ESHOP_SQL_PASSWORD:-Pass@word};TrustServerCertificate=True
  AppSettings__UseMockData: ${ESHOP_USE_MOCK_DATA:-False}
  AppSettings__UseAzureStorage: ${ESHOP_USE_AZURE_STORAGE:-False}
  Azure__StorageConnectionString: ${ESHOP_AZURE_STORAGE_CONNECTION_STRING:-}
  Azure__ApplicationInsights__ConnectionString: ${APP_INSIGHTS_CONNECTION_STRING:-}
  Logging__Console__FormatterName: json
  HEALTHCHECK_PATH: /health/ready

x-core-healthcheck: &core-healthcheck
  interval: 10s
  timeout: 3s
  start_period: 30s
  retries: 3

services:
  sql.data:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${ESHOP_SQL_PASSWORD:-Pass@word}
      ACCEPT_EULA: "Y"
    ports:
      - "5433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'select 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  eshop.core.modernized:
    image: eshop/coremodernized:${TAG:-latest}
    build:
      context: ./eShopModernized/src/eShopCoreModernized
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${ESHOP_CORE_VERSION:-1.0.0}
    environment:
      <<: *core-environment
      Deployment__Track: ${ESHOP_CORE_TRACK:-canary}
    ports:
      - "5002:8080"
    healthcheck: *core-healthcheck
    depends_on:
      sql.data:
        condition: service_healthy

  # Stand-in for the Windows-only .NET Framework app on :5001 so stage weights can be observed on Linux.
  eshop.core.baseline:
    image: eshop/coremodernized:${TAG:-latest}
    profiles: ["baseline"]
    environment:
      <<: *core-environment
      Deployment__Track: stable
    ports:
      - "5001:8080"
    healthcheck: *core-healthcheck
    depends_on:
      eshop.core.modernized:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - .:/etc/nginx/eshop:ro
    command: ["sh", "-c", "echo 'include /etc/nginx/eshop/nginx.conf;' > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      eshop.core.modernized:
        condition: service_healthy
